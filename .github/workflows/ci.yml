name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore SMSSearch.sln

      - name: Build Release
        run: dotnet build SMSSearch.sln -c Release --no-restore -p:IsPublishing=true

      - name: Run unit tests
        run: dotnet test SMSSearch.sln -c Release --no-build --verbosity normal

